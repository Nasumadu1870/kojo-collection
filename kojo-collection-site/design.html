<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design — Kojo Takes Photos</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;color:#1d1d1d;background:#fff;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:22px;height:66px;padding:0 32px;background:#ffffffe8;backdrop-filter:blur(8px);border-bottom:1px solid #e6e6e6}
.mark{display:flex;flex-direction:column;line-height:.84;color:#e4002b;text-decoration:none;font:27px 'Libre Caslon Display',serif}.mark small{font:700 9.5px Inter;letter-spacing:.2em;margin-top:5px;white-space:nowrap}
nav{display:flex;gap:20px;font:600 14px Inter}nav a{text-decoration:none;color:inherit}nav a:hover{text-decoration:underline}
main{max-width:1240px;margin:0 auto;padding:0 32px 80px}
h1{font:400 clamp(44px,6vw,76px)/1 'Libre Caslon Display',serif;margin:56px 0 12px}
.lede{max-width:720px;color:#666;font-size:17px;line-height:1.6;margin:0 0 26px}
.tabs{display:flex;gap:8px;margin:0 0 26px;flex-wrap:wrap}.tabs button{font:600 14px Inter;padding:8px 16px;border-radius:999px;border:1px solid #1d1d1d;background:#fff;cursor:pointer}.tabs button.on{background:#1d1d1d;color:#fff}
.wall{columns:4 230px;column-gap:18px}
figure{break-inside:avoid;margin:0 0 22px;cursor:zoom-in}figure img{width:100%;display:block;box-shadow:0 8px 24px -14px #0008;background:#f3f3f3}
figcaption{font-size:12.5px;color:#666;padding:8px 2px 0;line-height:1.45}figcaption b{color:#1d1d1d;font-weight:600;display:block;font-size:13.5px}
.brk{display:inline-block;font:700 10.5px Inter;letter-spacing:.1em;text-transform:uppercase;color:#e4002b;margin-left:6px}
.pin{column-span:all;max-width:760px;margin:0 0 34px}.pinlab{font:700 12px Inter;letter-spacing:.16em;text-transform:uppercase;color:#e4002b;margin-bottom:10px}.pinnote{display:block;margin-top:10px;font:400 18px/1.5 'Libre Caslon Display',serif;color:#1d1d1d}
.tag{position:absolute;top:8px;left:8px;z-index:2;font:700 11px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.04em;background:#fff;color:#111;padding:5px 7px;border-radius:3px;box-shadow:0 1px 4px #0005;cursor:copy;user-select:all}.tag.ok{background:#111;color:#fff}.tagwrap{position:relative}figure{position:relative}
#lb{position:fixed;inset:0;background:#000e;display:none;align-items:center;justify-content:center;z-index:50;cursor:zoom-out}#lb img{max-width:94vw;max-height:92vh}#lb.on{display:flex}
@media(max-width:860px){header{padding:0 18px;gap:14px}nav{overflow-x:auto;white-space:nowrap;gap:14px;font-size:13.5px;scrollbar-width:none}main{padding:0 18px 60px}.wall{columns:2 150px;column-gap:10px}figure{margin-bottom:14px}}
</style></head>
<body>
<header><a class="mark" href="index.html">KOJO<small>TAKES PHOTOS</small></a><nav><a href="collection.html">The Collection</a><a href="rooms.html">The Work</a><a href="design.html">Design</a><a href="census.html">The Census</a></nav></header>
<main>
<h1>Design</h1>
<p class="lede">Photoshop work, from summer-break experiments in 2023 to the BSU and RHA flyers. The dates and save counts come from each PSD file. Pieces made over winter or summer break are marked.</p>
<div class="tabs" id="tabs"></div>
<div class="wall" id="wall"></div>
</main>
<div id="lb"><img alt=""></div>
<script>
const $=s=>document.querySelector(s); let D=[], F='all';
const cat=x=>/bsu/i.test(x.folder)?'bsu':/RHA/.test(x.folder)?'rha':/Senio/.test(x.folder)?'senior':'experiments';
const brk=x=>{const m=+(x.modified||'').slice(5,7);return [6,7,8,12,1].includes(m)};
const nice=s=>s.replace(/[-_]+/g,' ').replace(/\b(copy|recovered|final|v\d+(\.\d+)?|mark \d+)\b/gi,'').replace(/\s+/g,' ').trim()||'Untitled';
function draw(){
  $('#tabs').innerHTML=[['all','All'],['break','Break work'],['bsu','BSU'],['rha','RHA'],['experiments','Experiments'],['senior','Senior year']].map(([k,l])=>`<button class="${F===k?'on':''}" onclick="F='${k}';draw()">${l}</button>`).join('');
  const L0=D.filter(x=>F==='all'||(F==='break'?brk(x):cat(x)===F)).sort((a,b)=>(b.modified||'').localeCompare(a.modified||'')); const L=[...L0.filter(x=>x.note),...L0.filter(x=>!x.note)];
  $('#wall').innerHTML=L.map(x=>`<figure id="${x.file}" class="${x.note?'pin':''}" data-src="images/design/${x.file}">${x.note?`<div class="pinlab">Where this museum started</div>`:''}<span class="tag" style="${x.note?'top:34px':''}">D-${x.file.slice(1,4)}</span><img loading="lazy" src="images/design/${x.file}" alt="${nice(x.name)}"><figcaption><b>${nice(x.name)}${brk(x)?'<span class="brk">Break</span>':''}</b>${x.modified}${x.saves?` · saved ${x.saves}×`:''}<br>${x.folder.split('/').slice(0,3).join(' / ')}${x.note?`<span class="pinnote">${x.note}</span>`:''}</figcaption></figure>`).join('');
}
document.addEventListener('click',e=>{const t=e.target.closest('.tag');if(!t)return;e.preventDefault();e.stopPropagation();try{navigator.clipboard.writeText(t.textContent)}catch(_){};t.classList.add('ok');const o=t.textContent;t.textContent='copied';setTimeout(()=>{t.textContent=o;t.classList.remove('ok')},900)},true);
document.addEventListener('click',e=>{const f=e.target.closest('figure');if(f){$('#lb img').src=f.dataset.src;$('#lb').classList.add('on')}else if(e.target.closest('#lb'))$('#lb').classList.remove('on')});
fetch('images/design/design_sel.json').then(r=>r.json()).then(j=>{D=j;draw();if(location.hash){const el=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(el)el.scrollIntoView()}});
</script>
</body></html>
